version: 1
backend:
  phases:
    build:
      commands:
        - npm install
        - npx prisma generate
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
        # Remove build cache + trace from .next/ so the deploy artifact stays
        # under Amplify's 230 MB limit. Cache is restored separately via the
        # `cache` section below, so this doesn't slow down rebuilds.
        - rm -rf .next/cache .next/trace
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
