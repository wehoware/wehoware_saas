version: 1
backend:
  phases:
    build:
      commands:
        - npm install
        - npx prisma generate
        # Push schema changes to the production database.
        # This adds new columns/tables without dropping existing data.
        # Uses DATABASE_URL from Amplify environment variables.
        - npx prisma db push 2>/dev/null || echo "[amplify] prisma db push skipped (DATABASE_URL may not be accessible at build time)"
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
        # AWS Amplify Lambda runtime doesn't inject server-side env vars
        # (only NEXT_PUBLIC_* vars get baked in at build time). Write
        # critical server-side env vars to .env.production so they're
        # available at Lambda runtime via dotenv.
        - |
          cat > .env.production << ENVEOF
          DATABASE_URL=${DATABASE_URL}
          NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
          NEXTAUTH_URL=${NEXTAUTH_URL}
          AUTH_TRUST_HOST=${AUTH_TRUST_HOST}
          APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY}
          S3_BUCKET_NAME=${S3_BUCKET_NAME}
          S3_CDN_URL=${S3_CDN_URL}
          PLAID_CLIENT_ID=${PLAID_CLIENT_ID}
          PLAID_SECRET=${PLAID_SECRET}
          PLAID_ENV=${PLAID_ENV}
          PLAID_PRODUCTS=${PLAID_PRODUCTS}
          PLAID_COUNTRY_CODES=${PLAID_COUNTRY_CODES}
          PLAID_WEBHOOK_URL=${PLAID_WEBHOOK_URL}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
          MICROSOFT_REDIRECT_URI=${MICROSOFT_REDIRECT_URI}
          ZOOM_REDIRECT_URI=${ZOOM_REDIRECT_URI}
          FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
          FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
          FACEBOOK_CALLBACK_URL=${FACEBOOK_CALLBACK_URL}
          INSTAGRAM_CALLBACK_URL=${INSTAGRAM_CALLBACK_URL}
          TWITTER_CALLBACK_URL=${TWITTER_CALLBACK_URL}
          TIKTOK_CALLBACK_URL=${TIKTOK_CALLBACK_URL}
          CRON_SECRET=${CRON_SECRET}
          CRON_AUTH_MODE=${CRON_AUTH_MODE}
          EMAIL_PROVIDER_MODE=${EMAIL_PROVIDER_MODE}
          EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
          SEO_LLM_PROVIDER_MODE=${SEO_LLM_PROVIDER_MODE}
          SEO_LLM_MANUAL_PROVIDER=${SEO_LLM_MANUAL_PROVIDER}
          SEO_LLM_AUTO_FAILOVER=${SEO_LLM_AUTO_FAILOVER}
          SEO_LLM_TIMEOUT_MS=${SEO_LLM_TIMEOUT_MS}
          SEO_LLM_CIRCUIT_BREAKER_THRESHOLD=${SEO_LLM_CIRCUIT_BREAKER_THRESHOLD}
          SEO_LLM_CIRCUIT_BREAKER_COOLDOWN_MS=${SEO_LLM_CIRCUIT_BREAKER_COOLDOWN_MS}
          OPENROUTER_DEFAULT_ANALYSIS_MODEL=${OPENROUTER_DEFAULT_ANALYSIS_MODEL}
          OPENROUTER_DEFAULT_SUGGESTION_MODEL=${OPENROUTER_DEFAULT_SUGGESTION_MODEL}
          WEHOWARE_DEFAULT_ANALYSIS_MODEL=${WEHOWARE_DEFAULT_ANALYSIS_MODEL}
          WEHOWARE_DEFAULT_SUGGESTION_MODEL=${WEHOWARE_DEFAULT_SUGGESTION_MODEL}
          SEO_ANALYSER_DUPLICATE_SIMILARITY_THRESHOLD=${SEO_ANALYSER_DUPLICATE_SIMILARITY_THRESHOLD}
          SEO_ANALYSER_NEAR_DUPLICATE_THRESHOLD=${SEO_ANALYSER_NEAR_DUPLICATE_THRESHOLD}
          SEO_ANALYSER_FRESHNESS_STALE_MONTHS=${SEO_ANALYSER_FRESHNESS_STALE_MONTHS}
          SEO_ANALYSER_TFIDF_LOW_THRESHOLD=${SEO_ANALYSER_TFIDF_LOW_THRESHOLD}
          SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
          VLLM_BASE_URL=${VLLM_BASE_URL}
          VLLM_API_KEY=${VLLM_API_KEY}
          VLLM_MODEL=${VLLM_MODEL}
          MEM0_BRIDGE_URL=${MEM0_BRIDGE_URL}
          ENVEOF
        # Copy .env.production into .next/ so it's included in the deploy artifact
        - cp .env.production .next/.env.production
        # Strip source maps + build cache + trace from .next/ so the deploy
        # artifact stays under Amplify's 230 MB limit. Source maps aren't
        # needed at runtime in production. Cache is preserved separately via
        # the `cache` section below, so this doesn't slow down rebuilds.
        - find .next -name "*.map" -type f -delete
        - rm -rf .next/cache .next/trace .next/server/cache .next/dev
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
