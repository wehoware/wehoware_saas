version: 1
backend:
  phases:
    build:
      commands:
        - npm install
        - npx prisma generate
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
        # Strip source maps + build cache + trace from .next/ so the deploy
        # artifact stays under Amplify's 230 MB limit. Source maps aren't
        # needed at runtime in production. Cache is preserved separately via
        # the `cache` section below, so this doesn't slow down rebuilds.
        - find .next -name "*.map" -type f -delete
        - rm -rf .next/cache .next/trace .next/server/cache .next/dev
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
